name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # No lockfile is committed (cli/package-lock.json was removed), so install from package.json.
      - run: npm install --no-audit --no-fund
      # cli/package.json and plugins/medra/.claude-plugin/plugin.json must carry the same version.
      - run: npm run check-version
      # The published package ships a copy of the plugin; make sure it still bundles.
      - run: npm run bundle-plugin
      # .agents/plugins/medra/ and cli/plugin/ must match plugins/medra/.
      - run: node scripts/check-bundle-drift.js
      - run: npm test
